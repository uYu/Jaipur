services:
  jaipur:
    image: jaipur:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${JAIPUR_PORT:-8204}:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
